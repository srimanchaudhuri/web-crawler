[project]
name = "web-crawler"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "async-lru>=2.3.0",
    "pydantic>=2.11.0",
    "requests>=2.34.2",
    "selectolax>=0.4.11",
    "tenacity>=9.1.4",
]

[project.scripts]
web-crawler = "web_crawler.main:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
